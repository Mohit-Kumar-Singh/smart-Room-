<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Room Remote</title>
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --bg:#14140f;
    --panel:#1d1c15;
    --panel-edge:#2c2a1f;
    --amber:#e8a33d;
    --amber-dim:#8a6626;
    --text:#f3ede1;
    --text-dim:#8c8778;
    --ok:#6fae6f;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:"SF Mono","Menlo",monospace; overscroll-behavior:none;}
  body{padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));}

  header{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:22px;}
  header h1{font-size:15px; letter-spacing:.18em; text-transform:uppercase; color:var(--text-dim); font-weight:500; margin:0;}
  header .status{font-size:11px; color:var(--ok);}
  header .status.off{color:#a85c5c;}

  .device{background:var(--panel); border:1px solid var(--panel-edge); border-radius:14px;
    margin-bottom:14px; overflow:hidden;}
  .device summary{list-style:none; padding:16px 18px; display:flex; align-items:center;
    justify-content:space-between; cursor:pointer;}
  .device summary::-webkit-details-marker{display:none;}
  .device summary .name{font-size:16px; letter-spacing:.02em;}
  .device summary .tag{font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.12em; margin-top:3px;}
  .chev{color:var(--amber-dim); transition:transform .2s;}
  details[open] .chev{transform:rotate(90deg);}

  .controls{padding:0 18px 18px; display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .controls.wide{grid-template-columns:1fr 1fr;}

  button.ctrl{
    background:#242217; border:1px solid var(--panel-edge); color:var(--text);
    border-radius:10px; padding:14px 8px; font-family:inherit; font-size:12px;
    letter-spacing:.04em; text-transform:uppercase;
  }
  button.ctrl:active{background:var(--amber-dim); color:#14140f; transform:scale(.97);}
  button.ctrl.primary{background:var(--amber); color:#14140f; border-color:var(--amber); font-weight:600;}
  button.ctrl.primary:active{background:#c98a2a;}

  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--amber); color:#14140f; padding:9px 16px; border-radius:20px;
    font-size:12px; opacity:0; transition:.25s; pointer-events:none;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .settings-btn{position:fixed; top:max(20px, env(safe-area-inset-top)); right:16px;
    background:none; border:none; color:var(--text-dim); font-size:18px;}

  dialog{background:var(--panel); color:var(--text); border:1px solid var(--panel-edge);
    border-radius:14px; padding:20px; width:min(320px,86vw); font-family:inherit;}
  dialog::backdrop{background:rgba(0,0,0,.6);}
  dialog input{width:100%; background:#14140f; border:1px solid var(--panel-edge); color:var(--text);
    padding:10px; border-radius:8px; margin:6px 0 14px; font-family:inherit; font-size:13px;}
  dialog label{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.1em;}
  dialog .row{display:flex; gap:10px; justify-content:flex-end;}
  dialog button{padding:9px 16px; border-radius:8px; border:1px solid var(--panel-edge); background:#242217; color:var(--text); font-family:inherit;}
  dialog button.save{background:var(--amber); color:#14140f; border:none; font-weight:600;}
</style>
</head>
<body>

<button class="settings-btn" onclick="settingsDialog.showModal()">⚙</button>

<header>
  <h1>Room Remote</h1>
  <span class="status" id="connStatus">checking…</span>
</header>

<!-- AC -->
<details class="device">
  <summary><div><div class="name">AC</div><div class="tag">IR</div></div><span class="chev">›</span></summary>
  <div class="controls">
    <button class="ctrl primary" onclick="fireButton('button.ac_power_toggle')">Power</button>
    <button class="ctrl" onclick="fireButton('button.ac_temp_up')">Temp +</button>
    <button class="ctrl" onclick="fireButton('button.ac_temp_down')">Temp −</button>
    <button class="ctrl" onclick="fireButton('button.ac_mode')">Mode</button>
    <button class="ctrl" onclick="fireButton('button.ac_fan')">Fan</button>
    <button class="ctrl" onclick="fireButton('button.ac_swing')">Swing</button>
    <button class="ctrl" onclick="fireButton('button.ac_turbo')">Turbo</button>
  </div>
</details>

<!-- LG Monitor (LG 32SR50F-W, webOS over WiFi) -->
<details class="device">
  <summary><div><div class="name">LG Monitor</div><div class="tag">WiFi · webOS</div></div><span class="chev">›</span></summary>
  <div class="controls">
    <button class="ctrl primary" onclick="mp('toggle')">Power</button>
    <button class="ctrl" onclick="mp('volume_up')">Vol +</button>
    <button class="ctrl" onclick="mp('volume_down')">Vol −</button>
    <button class="ctrl" onclick="mp('volume_mute', {is_volume_muted: true})">Mute</button>
    <button class="ctrl" onclick="mp('media_play_pause')">Play/Pause</button>
    <div class="ctrl" style="text-align:left; cursor:default;">State<br><b id="s_mon">–</b></div>
  </div>
</details>

<!-- Room Bulb (Amazon Basics 12W RGB WiFi) -->
<details class="device">
  <summary><div><div class="name">Bulb</div><div class="tag">WiFi · RGB</div></div><span class="chev">›</span></summary>
  <div class="controls">
    <button class="ctrl primary" onclick="toggleEntity('light.room_bulb')">Toggle</button>
    <button class="ctrl" onclick="setBrightness('light.room_bulb', 255)">Full</button>
    <button class="ctrl" onclick="setBrightness('light.room_bulb', 60)">Dim</button>
    <button class="ctrl" onclick="setBrightness('light.room_bulb', 15)">Night</button>
    <button class="ctrl" onclick="setWhite('light.room_bulb', 2700)">Warm</button>
    <button class="ctrl" onclick="setWhite('light.room_bulb', 6500)">Cool</button>
    <button class="ctrl" onclick="setColor('light.room_bulb', [255,0,0])">Red</button>
    <button class="ctrl" onclick="setColor('light.room_bulb', [0,255,0])">Green</button>
    <button class="ctrl" onclick="setColor('light.room_bulb', [0,80,255])">Blue</button>
  </div>
</details>

<!-- WiFi Switches -->
<details class="device">
  <summary><div><div class="name">Switches</div><div class="tag">WiFi</div></div><span class="chev">›</span></summary>
  <div class="controls wide">
    <button class="ctrl primary" onclick="toggleEntity('switch.room_switch_1')">Switch 1</button>
    <button class="ctrl primary" onclick="toggleEntity('switch.room_switch_2')">Switch 2</button>
  </div>
</details>

<!-- Freshener -->
<details class="device">
  <summary><div><div class="name">Freshener</div><div class="tag">Bluetooth</div></div><span class="chev">›</span></summary>
  <div class="controls wide">
    <button class="ctrl primary" onclick="fireButton('button.freshener_spray')">Spray now</button>
    <button class="ctrl" onclick="toggleEntity('switch.freshener_auto')">Auto mode</button>
  </div>
</details>

<!-- Door Lock -->
<details class="device">
  <summary><div><div class="name">Door</div><div class="tag">Lock</div></div><span class="chev">›</span></summary>
  <div class="controls wide">
    <button class="ctrl primary" onclick="lockDoor(false)">Unlock</button>
    <button class="ctrl" onclick="lockDoor(true)">Lock</button>
    <div class="ctrl" style="text-align:left; cursor:default;">Lock<br><b id="s_lock">–</b></div>
    <div class="ctrl" style="text-align:left; cursor:default;">Door<br><b id="s_door">–</b></div>
  </div>
</details>

<!-- LED Strip (IR remote) -->
<details class="device">
  <summary><div><div class="name">LED Strip</div><div class="tag">IR</div></div><span class="chev">›</span></summary>
  <div class="controls">
    <button class="ctrl primary" onclick="fireButton('button.led_strip_power')">Power</button>
    <button class="ctrl" onclick="fireButton('button.led_strip_bright_up')">Bright +</button>
    <button class="ctrl" onclick="fireButton('button.led_strip_bright_down')">Bright −</button>
    <button class="ctrl" onclick="fireButton('button.led_strip_white')">White</button>
    <button class="ctrl" onclick="fireButton('button.led_strip_red')">Red</button>
    <button class="ctrl" onclick="fireButton('button.led_strip_green')">Green</button>
    <button class="ctrl" onclick="fireButton('button.led_strip_blue')">Blue</button>
    <button class="ctrl" onclick="fireButton('button.led_strip_flash')">Flash</button>
    <button class="ctrl" onclick="fireButton('button.led_strip_fade')">Fade</button>
  </div>
</details>

<!-- Mosquito Repellent (smart plug) -->
<details class="device">
  <summary><div><div class="name">Mosquito Repellent</div><div class="tag">WiFi · Plug</div></div><span class="chev">›</span></summary>
  <div class="controls wide">
    <button class="ctrl primary" onclick="toggleEntity('switch.mosquito_repellent')">Toggle</button>
  </div>
</details>

<!-- Room Sensors -->
<details class="device" open>
  <summary><div><div class="name">Room</div><div class="tag">Sensors</div></div><span class="chev">›</span></summary>
  <div class="controls wide" id="sensorGrid" style="grid-template-columns:repeat(2,1fr);">
    <div class="ctrl" style="text-align:left; cursor:default;">Temp<br><b id="s_temp">–</b></div>
    <div class="ctrl" style="text-align:left; cursor:default;">Humidity<br><b id="s_humidity">–</b></div>
    <div class="ctrl" style="text-align:left; cursor:default;">Noise<br><b id="s_noise">–</b></div>
    <div class="ctrl" style="text-align:left; cursor:default;">Air Quality<br><b id="s_air">–</b></div>
    <div class="ctrl" style="text-align:left; cursor:default;">Presence<br><b id="s_presence">–</b></div>
    <div class="ctrl" style="text-align:left; cursor:default;">Motion<br><b id="s_motion">–</b></div>
  </div>
</details>

<div class="toast" id="toast">Sent</div>

<dialog id="settingsDialog">
  <label>Home Assistant URL</label>
  <input id="haUrl" placeholder="http://homeassistant.local:8123">
  <label>Long-Lived Access Token</label>
  <input id="haToken" type="password" placeholder="paste token">
  <div class="row">
    <button onclick="settingsDialog.close()">Cancel</button>
    <button class="save" onclick="saveSettings()">Save</button>
  </div>
</dialog>

<script>
// Settings persist in localStorage. Wrapped in try/catch because private-mode
// browsers and some webviews throw on access.
function lsGet(k){ try { return localStorage.getItem(k) || ""; } catch(e){ return ""; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }

let HA_URL = lsGet('ha_url');       // e.g. http://homeassistant.local:8123
let HA_TOKEN = lsGet('ha_token');

function saveSettings(){
  HA_URL = document.getElementById('haUrl').value.replace(/\/$/,'');
  HA_TOKEN = document.getElementById('haToken').value;
  lsSet('ha_url', HA_URL);
  lsSet('ha_token', HA_TOKEN);
  settingsDialog.close();
  checkConnection();
  refreshSensors();
}

// Prefill the dialog with saved values whenever it opens.
document.querySelector('.settings-btn').addEventListener('click', () => {
  document.getElementById('haUrl').value = HA_URL;
  document.getElementById('haToken').value = HA_TOKEN;
});

async function haCall(path, body){
  if(!HA_URL || !HA_TOKEN){ settingsDialog.showModal(); return; }
  try{
    const res = await fetch(`${HA_URL}${path}`, {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${HA_TOKEN}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(body)
    });
    if(!res.ok) throw new Error(res.status);
    showToast('Sent');
  }catch(e){ showToast('Failed — check settings'); }
}

function fireButton(entityId){
  haCall('/api/services/button/press', { entity_id: entityId });
}
function toggleEntity(entityId){
  const domain = entityId.split('.')[0];
  haCall(`/api/services/${domain}/toggle`, { entity_id: entityId });
}
function setBrightness(entityId, brightness){
  haCall('/api/services/light/turn_on', { entity_id: entityId, brightness });
}
function setColor(entityId, rgb){
  haCall('/api/services/light/turn_on', { entity_id: entityId, rgb_color: rgb });
}
function setWhite(entityId, kelvin){
  haCall('/api/services/light/turn_on', { entity_id: entityId, kelvin });
}
function lockDoor(shouldLock){
  haCall(`/api/services/lock/${shouldLock ? 'lock' : 'unlock'}`, { entity_id: 'lock.room_door' });
}
function mp(service, extra){
  haCall(`/api/services/media_player/${service}`,
    Object.assign({ entity_id: 'media_player.lg_monitor' }, extra || {}));
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1400);
}

async function checkConnection(){
  const el = document.getElementById('connStatus');
  if(!HA_URL || !HA_TOKEN){ el.textContent = 'not configured'; el.className='status off'; return; }
  try{
    const res = await fetch(`${HA_URL}/api/`, { headers: { 'Authorization': `Bearer ${HA_TOKEN}` }});
    if(res.ok){ el.textContent = 'connected'; el.className = 'status'; }
    else throw new Error();
  }catch(e){ el.textContent = 'offline'; el.className = 'status off'; }
}

async function getState(entityId){
  if(!HA_URL || !HA_TOKEN) return null;
  try{
    const res = await fetch(`${HA_URL}/api/states/${entityId}`, {
      headers: { 'Authorization': `Bearer ${HA_TOKEN}` }
    });
    if(!res.ok) return null;
    return await res.json();
  }catch(e){ return null; }
}

async function refreshSensors(){
  const map = {
    s_temp: ['sensor.room_temperature', v => v ? `${parseFloat(v).toFixed(1)}°C` : '–'],
    s_humidity: ['sensor.room_humidity', v => v ? `${parseFloat(v).toFixed(0)}%` : '–'],
    s_noise: ['sensor.room_noise_level', v => v ? `${parseFloat(v).toFixed(0)}` : '–'],
    s_air: ['sensor.room_air_quality_raw', v => v ? `${parseFloat(v).toFixed(0)}` : '–'],
    s_presence: ['binary_sensor.room_occupied', v => v === 'on' ? 'Yes' : v === 'off' ? 'No' : '–'],
    s_motion: ['binary_sensor.room_motion', v => v === 'on' ? 'Yes' : v === 'off' ? 'No' : '–'],
    s_lock: ['lock.room_door', v => v ? v[0].toUpperCase() + v.slice(1) : '–'],
    s_door: ['binary_sensor.room_door', v => v === 'on' ? 'Open' : v === 'off' ? 'Closed' : '–'],
    s_mon: ['media_player.lg_monitor', v => v ? v[0].toUpperCase() + v.slice(1) : '–'],
  };
  for(const [elId, [entity, fmt]] of Object.entries(map)){
    const state = await getState(entity);
    document.getElementById(elId).textContent = fmt(state ? state.state : null);
  }
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
checkConnection();
refreshSensors();
setInterval(refreshSensors, 10000); // poll every 10s while the app is open
</script>
</body>
</html>
